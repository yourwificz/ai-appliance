services:
  open-webui:
    image: "${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:latest}"
    container_name: open-webui
    restart: unless-stopped

    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - searxng

    environment:
      # Ollama runs directly on the Docker host.
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"

      # Public Open WebUI URL used for SSO callbacks and generated links.
      WEBUI_URL: "${WEBUI_URL:-https://ai.yourwifi.cz}"

      # Must be set in docker/.env and kept stable.
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in docker/.env}"

      # Keep existing Admin UI configuration persistent.
      ENABLE_PERSISTENT_CONFIG: "${ENABLE_PERSISTENT_CONFIG:-true}"

      # Microsoft Entra ID SSO.
      MICROSOFT_CLIENT_ID: "${MICROSOFT_CLIENT_ID:?Set MICROSOFT_CLIENT_ID in docker/.env}"
      MICROSOFT_CLIENT_SECRET: "${MICROSOFT_CLIENT_SECRET:?Set MICROSOFT_CLIENT_SECRET in docker/.env}"
      MICROSOFT_CLIENT_TENANT_ID: "${MICROSOFT_CLIENT_TENANT_ID:?Set MICROSOFT_CLIENT_TENANT_ID in docker/.env}"

      MICROSOFT_REDIRECT_URI: "${WEBUI_URL:-https://ai.yourwifi.cz}/oauth/microsoft/callback"
      OPENID_PROVIDER_URL: "https://login.microsoftonline.com/${MICROSOFT_CLIENT_TENANT_ID}/v2.0/.well-known/openid-configuration"

      ENABLE_OAUTH_SIGNUP: "${ENABLE_OAUTH_SIGNUP:-true}"

      # OAuth settings remain controlled by environment variables even when
      # other Open WebUI settings are managed through the Admin UI.
      ENABLE_OAUTH_PERSISTENT_CONFIG: "${ENABLE_OAUTH_PERSISTENT_CONFIG:-false}"

      OAUTH_SESSION_TOKEN_ENCRYPTION_KEY: "${OAUTH_SESSION_TOKEN_ENCRYPTION_KEY:?Set OAUTH_SESSION_TOKEN_ENCRYPTION_KEY in docker/.env}"
      OAUTH_CLIENT_INFO_ENCRYPTION_KEY: "${OAUTH_CLIENT_INFO_ENCRYPTION_KEY:?Set OAUTH_CLIENT_INFO_ENCRYPTION_KEY in docker/.env}"

      # Web search.
      ENABLE_WEB_SEARCH: "${ENABLE_WEB_SEARCH:-true}"
      WEB_SEARCH_ENGINE: "${WEB_SEARCH_ENGINE:-searxng}"
      WEB_SEARCH_RESULT_COUNT: "${WEB_SEARCH_RESULT_COUNT:-3}"

      # Search-engine request concurrency.
      WEB_SEARCH_CONCURRENT_REQUESTS: "${WEB_SEARCH_CONCURRENT_REQUESTS:-10}"

      # Full-page web-loader concurrency, used when the bypass is disabled.
      WEB_LOADER_CONCURRENT_REQUESTS: "${WEB_LOADER_CONCURRENT_REQUESTS:-10}"

      # Temporary workaround for the current Open WebUI web-loader issue.
      # This uses result snippets without fetching the full result pages.
      BYPASS_WEB_SEARCH_WEB_LOADER: "${BYPASS_WEB_SEARCH_WEB_LOADER:-true}"

      # Use the internal Compose network rather than routing through nginx.
      SEARXNG_QUERY_URL: "${SEARXNG_QUERY_URL:-http://searxng:8080/search?q=<query>}"

    volumes:
      - "${OPEN_WEBUI_DATA_DIR:-/mnt/ai-data/openwebui}:/app/backend/data"

  searxng:
    image: "${SEARXNG_IMAGE:-docker.io/searxng/searxng:latest}"
    container_name: searxng
    restart: unless-stopped

    ports:
      - "${SEARXNG_PORT:-8081}:8080"

    volumes:
      - "${SEARXNG_CONFIG_DIR:-/mnt/ai-data/searxng}:/etc/searxng"

    environment:
      SEARXNG_BASE_URL: "${SEARXNG_BASE_URL:-https://search.yourwifi.cz/}"
